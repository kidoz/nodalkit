name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        # Pinned: the distro package floats across LLVM releases, whose
        # formatting differs, so an unpinned check fails on untouched files.
        # Keep this in step with the clang-format developers run locally.
        run: pipx install clang-format==22.1.8
      - name: Check formatting
        run: |
          find src include tests examples -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.mm' \) \
            | xargs clang-format --dry-run --Werror

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-tidy \
            ninja-build \
            pkg-config \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libxkbcommon-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libglib2.0-dev
          # apt's meson (1.3.x on ubuntu-latest) is older than the project's
          # >= 1.11 floor; install a current one via pipx instead.
          pipx install meson
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: meson setup build-clang-tidy
      # The Wayland sources include wayland-scanner output that only exists
      # after a build, so generate it before linting.
      - name: Build
        run: meson compile -C build-clang-tidy
      - name: Run clang-tidy
        # Lint the files the Linux configuration actually compiles. Feeding
        # platform-mismatched sources (macOS .mm, Win32 .cpp) into a Linux
        # compile database makes clang-tidy interpolate flags for them,
        # dropping -std=c++23 and producing bogus hard errors.
        run: |
          jq -r '.[] | if (.file | startswith("/")) then .file else .directory + "/" + .file end' \
            build-clang-tidy/compile_commands.json \
            | xargs -n1 realpath | sort -u \
            | grep -E "^$PWD/(src|tests|examples)/" \
            | xargs -P "$(nproc)" -n1 clang-tidy -p build-clang-tidy

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        buildtype: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libxkbcommon-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libglib2.0-dev \
            libvulkan-dev \
            glslang-tools \
            weston \
            mesa-vulkan-drivers
          # apt's meson (1.3.x on ubuntu-latest) is older than the project's
          # >= 1.11 floor; install a current one via pipx instead.
          pipx install meson
        if: runner.os == 'Linux'
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install meson ninja pkg-config
      - name: Configure
        run: meson setup build-${{ matrix.os }}-${{ matrix.buildtype }} --buildtype=${{ matrix.buildtype }} --prefix="$PWD/.local" --libdir=lib
      - name: Build
        run: meson compile -C build-${{ matrix.os }}-${{ matrix.buildtype }}
      # The suite exercises the real Wayland + Vulkan paths (native surfaces,
      # localized-redraw damage gates), so give it a headless compositor and
      # Mesa's software Vulkan device instead of the windowless fallback.
      - name: Start headless Wayland session
        if: runner.os == 'Linux'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=nodalkit-ci --idle-time=0 &> "$RUNNER_TEMP/weston.log" &
          sleep 2
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=nodalkit-ci" >> "$GITHUB_ENV"
      - name: Test
        run: meson test -C build-${{ matrix.os }}-${{ matrix.buildtype }} --print-errorlogs
      - name: Install
        run: meson install -C build-${{ matrix.os }}-${{ matrix.buildtype }}
      - name: Install smoke
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/.local/lib/pkgconfig
        run: |
          meson setup build-install-smoke-${{ matrix.os }}-${{ matrix.buildtype }} tests/install_smoke
          meson test -C build-install-smoke-${{ matrix.os }}-${{ matrix.buildtype }} --print-errorlogs
      # Regenerate the Linux showcase page captures (every page, light and
      # dark) so visual regressions can be reviewed from CI artifacts.
      - name: Capture showcase page screenshots
        if: runner.os == 'Linux' && matrix.buildtype == 'debug'
        run: ./build-${{ matrix.os }}-debug/examples/showcase --screenshot-dir="$RUNNER_TEMP/showcase-pages"
      - name: Upload showcase page screenshots
        if: runner.os == 'Linux' && matrix.buildtype == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: showcase-pages
          path: ${{ runner.temp }}/showcase-pages/*.ppm

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        buildtype: [debug, release]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install meson and ninja
        run: python -m pip install meson ninja
      # NodalKit's Windows build uses clang (the sources rely on clang-only
      # flags such as -Wno-c2y-extensions), which is preinstalled on the runner.
      # msvc-dev-cmd only supplies the Windows SDK / CRT headers and import
      # libraries (INCLUDE / LIB) for the selected architecture; clang links
      # against them.
      - name: Set up Windows SDK environment (${{ matrix.arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Configure (x64 native)
        if: matrix.arch == 'x64'
        env:
          CC: clang
          CXX: clang++
        run: meson setup build --buildtype=${{ matrix.buildtype }} --prefix="$PWD/.local" --libdir=lib
      - name: Configure (x86 / i686 cross)
        if: matrix.arch == 'x86'
        run: meson setup build --cross-file ci/windows-i686-clang.ini --buildtype=${{ matrix.buildtype }} --prefix="$PWD/.local" --libdir=lib
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Install
        run: meson install -C build
      # nodalkit.pc must carry the transitive Windows import libraries in its
      # link line so downstream static links resolve; assert they are present.
      - name: Verify nodalkit.pc exports Windows link flags
        run: |
          pc="$PWD/.local/lib/pkgconfig/nodalkit.pc"
          test -f "$pc" || { echo "nodalkit.pc not installed"; exit 1; }
          grep -Eq -- '-luser32' "$pc" || { echo "nodalkit.pc missing Windows system libs"; cat "$pc"; exit 1; }
          cat "$pc"

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sanitizer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ninja-build \
            pkg-config \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libxkbcommon-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libglib2.0-dev \
            libvulkan-dev \
            glslang-tools \
            weston \
            mesa-vulkan-drivers
          # apt's meson (1.3.x on ubuntu-latest) is older than the project's
          # >= 1.11 floor; install a current one via pipx instead.
          pipx install meson
      - name: Configure sanitizer build
        env:
          CC: clang
          CXX: clang++
        # b_lundef=false: clang links the ASan runtime statically into the
        # executables only, so the shared library legitimately carries
        # undefined __asan_* references that -Wl,--no-undefined would reject.
        run: meson setup build-asan-ubsan --buildtype=debug -Db_sanitize=address,undefined -Db_lundef=false
      - name: Build sanitizer target
        run: meson compile -C build-asan-ubsan
      - name: Start headless Wayland session
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=nodalkit-ci --idle-time=0 &> "$RUNNER_TEMP/weston.log" &
          sleep 2
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=nodalkit-ci" >> "$GITHUB_ENV"
      - name: Test sanitizer target
        run: meson test -C build-asan-ubsan --print-errorlogs
